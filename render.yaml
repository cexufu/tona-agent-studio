services:
  - type: web
    name: tona-agent-studio
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /gateway/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: TEAMFLOW_DATA_DIR
        value: /var/data/teamflow
      - key: TEAMFLOW_INITIAL_ADMIN_PASSWORD
        sync: false
      - key: TONA_RESEARCH_OWNER_EMAIL
        value: admin@team.local
      - key: TONA_RESEARCH_STUDIO_URL
        value: https://tona-research-studio.fucx9501.chatgpt.site
      - key: OPENWORKER_MODE
        value: embedded
      - key: OPENWORKER_ENABLED
        value: "true"
      - key: OPENWORKER_API_TOKEN
        generateValue: true
      - key: OPENWORKER_DEFAULT_MODE
        value: interactive
      - key: OPENWORKER_STATE_DIR
        value: /var/data/openworker/state
      - key: OPENWORKER_WORKSPACE
        value: /var/data/openworker/workspace
      - key: TONA_OAUTH_STATE_KEY
        sync: false
      - key: TONA_EXECUTOR_URL
        sync: false
      - key: TONA_EXECUTOR_TOKEN
        sync: false
      - key: TONA_PYTHON_RUNNER_URL
        sync: false
      - key: TONA_PYTHON_RUNNER_TOKEN
        sync: false
      - key: REMINDER_TIMEZONE
        value: Asia/Shanghai
      - key: REMINDER_HOUR
        value: 9
    disk:
      name: tona-agent-data
      mountPath: /var/data
      sizeGB: 1
